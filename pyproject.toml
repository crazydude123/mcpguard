[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpguard"
version = "0.1.0"
description = "Static analyzer for MCP-server codebases — catches the 7 bug classes producing 2026 CVEs and bug bounties."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["mcp", "model-context-protocol", "security", "audit", "static-analysis"]

[project.urls]
Repository = "https://github.com/crazydude123/mcpguard"

[project.scripts]
mcpguard = "mcpguard:main"

[tool.setuptools]
py-modules = ["mcpguard"]
